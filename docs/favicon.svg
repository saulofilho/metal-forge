<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F1F24"/>
      <stop offset="100%" stop-color="#0A0A0B"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5FF44"/>
      <stop offset="100%" stop-color="#CCFF00"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#CCFF00" flood-opacity="0.8"/>
    </filter>
  </defs>
  <!-- Rounded Base Shield / Pick -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#metalGrad)" stroke="#333338" stroke-width="2"/>
  <rect x="6" y="6" width="52" height="52" rx="12" fill="none" stroke="#CCFF00" stroke-opacity="0.25" stroke-width="1.5"/>
  <!-- Drop C Lettermark & Electric Bolt Motif -->
  <!-- Stylized C -->
  <path d="M42 22 C37 16, 23 16, 18 25 C13 34, 15 44, 23 48 C29 51, 38 49, 42 44" fill="none" stroke="url(#neonGrad)" stroke-width="5" stroke-linecap="round" filter="url(#neonGlow)"/>
  <!-- Lightning Bolt Cut -->
  <path d="M34 16 L25 32 L33 32 L27 48 L41 30 L33 30 Z" fill="#CCFF00" filter="url(#neonGlow)"/>
